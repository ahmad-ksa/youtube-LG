name: probe
on:
  push:
    branches: [probe]
  workflow_dispatch:
permissions:
  issues: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd probe && npm i --silent && node probe.mjs 2>&1 | grep -v '^\[YOUTUBEJS\]' | tee out.txt
      - env: { GH_TOKEN: '${{ github.token }}' }
        run: gh issue create -R ${{ github.repository }} -t "probe ${{ github.run_number }}" -b "$(cat probe/out.txt | head -c 60000)"
